name: Reprio - sondar endpoints
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.REPRIO_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          B='https://yahrccahjmybgolvhbkd.supabase.co/functions/v1/'
          out=[]
          def get(p):
              r=urllib.request.Request(B+p,headers={'Authorization':'Bearer '+os.environ.get('KEY','')})
              try:
                  with urllib.request.urlopen(r,timeout=30) as f: return f.status,json.load(f)
              except urllib.error.HTTPError as e: return e.code,e.read()[:200].decode('utf8','ignore')
              except Exception as e: return 0,str(e)
          s,d=get('api-representantes?limit=200')
          out.append('REPS:'+';'.join(f"{x['id']}={x['nome']}" for x in d.get('data',[])))
          allp=[];pg=1
          while True:
              s,d=get(f'api-prazos?limit=200&page={pg}'); dd=d.get('data',[]) if isinstance(d,dict) else []; allp+=dd
              if len(dd)<200 or pg>10: break
              pg+=1
          m=[x for x in allp if str(x.get('codigo_erp') or '').upper()=='MARLUVAS' or 'Encargo' in str(x.get('nome'))]
          out.append(f'PRAZOS total={len(allp)} marluvas={len(m)}')
          out.append('PZ:'+';'.join(f"{x['id']}={x['nome']}" for x in m))
          s='\n'.join(out)
          for i in range(0,len(s),3500): print('::notice title=p'+str(i//3500)+'::'+s[i:i+3500].replace('%','%25').replace('\n','%0A'))
          PY
