name: Reprio - mapear estrutura da API
on:
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar API (somente estrutura, sem dados de clientes)
        env:
          KEY: ${{ secrets.REPRIO_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,builtins
          OUT=[]
          def print(*a,**k): OUT.append(' '.join(str(x) for x in a))
          B='https://yahrccahjmybgolvhbkd.supabase.co/functions/v1/'
          def get(p):
              r=urllib.request.Request(B+p,headers={'Authorization':'Bearer '+os.environ['KEY']})
              try:
                  with urllib.request.urlopen(r,timeout=30) as f: return json.load(f)
              except Exception as e: return {'erro':str(e)}
          def shape(o,d=0):
              if isinstance(o,dict): return {k:shape(v,d+1) for k,v in o.items()}
              if isinstance(o,list): return [shape(o[0],d+1)] if o else []
              return type(o).__name__
          t=get('api-tabelas-preco')
          print('TABELAS:'); [print(' ',x.get('id'),'|',x.get('codigo_erp'),'|',x.get('nome')) for x in (t.get('data') or [])] if 'data' in t else print(t)
          p=get('api-produtos?limit=200')
          d=p.get('data') or []
          print('PRODUTOS total:',(p.get('pagination') or {}).get('total'))
          print('ESTRUTURA PRODUTO:',json.dumps(shape(d[0]) if d else p)[:3000])
          for x in d[:6]: print('  codigo=',x.get('codigo'),'| codigo_erp=',x.get('codigo_erp'),'|',str(x.get('descricao'))[:40])
          print('PEDIDO resp:',str(get('api-pedidos/2026-000462'))[:300])
          print('PEDIDOS lista:',str(get('api-pedidos?limit=1&resumido=1'))[:300])
          import collections,re
          allp=[];pg=1
          while True:
              r=get(f'api-produtos?limit=200&page={pg}'); dd=r.get('data') or []; allp+=dd
              if len(dd)<200 or pg>60: break
              pg+=1
          rep=collections.Counter(x.get('representada_id') for x in allp)
          print('REPRESENTADAS (id: qtd produtos):',dict(rep))
          m=[x for x in allp if re.match(r'^70\d{4}',str(x.get('codigo','')))]
          print('MARLUVAS produtos:',len(m),'representada:',collections.Counter(x.get('representada_id') for x in m))
          base=[x['codigo'] for x in m if '-' not in x['codigo']]; var=[x['codigo'] for x in m if '-' in x['codigo']]
          print('bases',len(base),'variacoes',len(var),'exemplos var 701402:',[c for c in var if c.startswith('701402-')])
          print('usa_multiplo_por_variacao',collections.Counter(x.get('usa_multiplo_por_variacao') for x in m),'tipo_produto',collections.Counter(x.get('tipo_produto') for x in m))
          print('CLIENTE teste:',str({k:v for k,v in ((get('api-clientes?cnpj=30557285000127').get('data') or [{}])[0]).items() if k in ('id','codigo_erp','representante_id','status')}))
          s='\n'.join(OUT)
          for i in range(0,len(s),3500): builtins.print('::notice title=reprio'+str(i//3500)+'::'+s[i:i+3500].replace('%','%25').replace('\r','').replace('\n','%0A'))
          PY
