name: Reprio - mapear estrutura da API
on:
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar API (somente estrutura, sem dados de clientes)
        env:
          KEY: ${{ secrets.REPRIO_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,builtins
          OUT=[]
          def print(*a,**k): OUT.append(' '.join(str(x) for x in a))
          B='https://yahrccahjmybgolvhbkd.supabase.co/functions/v1/'
          def get(p):
              r=urllib.request.Request(B+p,headers={'Authorization':'Bearer '+os.environ['KEY']})
              try:
                  with urllib.request.urlopen(r,timeout=30) as f: return json.load(f)
              except Exception as e: return {'erro':str(e)}
          def shape(o,d=0):
              if isinstance(o,dict): return {k:shape(v,d+1) for k,v in o.items()}
              if isinstance(o,list): return [shape(o[0],d+1)] if o else []
              return type(o).__name__
          t=get('api-tabelas-preco')
          d=t.get('data') if isinstance(t,dict) else t
          print('TABELAS:'); [print(' ',x.get('id'),'|',x.get('codigo_erp'),'|',x.get('nome'),'|',x.get('representada_id')) for x in (d or [])] if d else print(str(t)[:300])
          ped=get('api-pedidos/2026-000462'); dd=ped.get('data') or {}
          if not dd: print('PEDIDO resp:',str(ped)[:300])
          print('PEDIDO campos:',[k for k in dd.keys()])
          for k,v in dd.items():
              if k.endswith('_id') or k in ('status','origem_pedido','data_pedido','numero_pedido'): print(' ',k,'=',v)
              elif isinstance(v,dict): print(' ',k,'=',{kk:vv for kk,vv in v.items() if kk in ('id','codigo_erp','nome','razao_social','descricao','codigo')} if k!='cliente' else '<cliente>')
          its=dd.get('itens') or []
          print('ITENS:',len(its))
          for it in its[:4]:
              print('  ',json.dumps({k:(v if not any(w in k for w in ('preco','valor','desconto','total')) else '<oc>') for k,v in it.items() if not isinstance(v,dict)},ensure_ascii=False,default=str)[:700])
              for k,v in it.items():
                  if isinstance(v,dict): print('     ',k,'=',{kk:vv for kk,vv in v.items() if kk in ('id','codigo','descricao')})
          import collections,re
          allp=[];pg=1
          while True:
              r=get(f'api-produtos?limit=200&page={pg}'); dd2=r.get('data') or []; allp+=dd2
              if len(dd2)<200 or pg>60: break
              pg+=1
          M='35d0632c-d694-485e-bf78-4be2eca6a4bc'
          var=collections.defaultdict(list)
          for x in allp:
              c=str(x.get('codigo',''))
              if x.get('representada_id')==M and '-' in c: b,s=c.split('-',1); var[b].append(s)
          print('VARMAP bases:',len(var))
          print('VARMAP:'+';'.join(b+':'+','.join(v) for b,v in sorted(var.items())))
          s='\n'.join(OUT)
          for i in range(0,len(s),3500): builtins.print('::notice title=reprio'+str(i//3500)+'::'+s[i:i+3500].replace('%','%25').replace('\r','').replace('\n','%0A'))
          PY
