name: Marluvas - mapear site
on:
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request
          UA={'User-Agent':'Mozilla/5.0'}
          allp=[]
          for pg in range(1,20):
              d=json.load(urllib.request.urlopen(urllib.request.Request(f'https://www.marluvas.com.br/products.json?limit=250&page={pg}',headers=UA),timeout=60))['products']
              allp+=d
              if len(d)<250: break
          out=[f'total {len(allp)}']
          p=allp[0]; out.append('chaves '+str(list(p.keys())))
          out.append('variante '+json.dumps({k:p['variants'][0].get(k) for k in ('sku','title','barcode','option1','option2')},ensure_ascii=False))
          for p in allp[:12]: out.append(f"{p['title']} | handle={p['handle']} | skus={[v.get('sku') for v in p['variants']][:3]} | imgs={len(p['images'])} | {p['images'][0]['src'][:90] if p['images'] else ''}")
          import re
          hit=[p['title'] for p in allp if '35B19' in p['title'] or any('701518' in str(v.get('sku')) for v in p['variants'])]
          out.append('35B19/701518: '+str(hit[:5]))
          s='\n'.join(out)
          for i in range(0,len(s),3500): print('::notice title=s'+str(i//3500)+'::'+s[i:i+3500].replace('%','%25').replace('\n','%0A'))
          PY
