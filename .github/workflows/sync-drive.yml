name: Sincronizar fichas e imagens do Drive
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 .github/scripts/sync_drive.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add fichas.json img
          git diff --cached --quiet || (git commit -m "Sincroniza fichas e imagens do Drive" && git push)
